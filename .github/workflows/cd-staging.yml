name: CD - Staging

on:
  push:
    branches: [ staging ] # Triggered on a merge/push to staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging # Injects staging environment secrets
    steps:
      - name: Step 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Step 3 - Trigger Render Deployment Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING_URL }}

      - name: Step 4 - Confirm Deployment
        run: |
          echo "Deployment to staging triggered at $(date)"