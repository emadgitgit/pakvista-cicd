name: CI - Development

on:
  pull_request:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Step 2 - Lint and Build Validation
        run: |
          echo "Simulating Linting HTML with HTMLHint and CSS with Stylelint"
          echo "Simulating Build with Parcel"

      - name: Step 3 - Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Step 4 & 5 - Build and Tag Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:dev-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:dev-${{ github.sha }}

      - name: Step 6 - Push Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:dev-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:dev-${{ github.sha }}